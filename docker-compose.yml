version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=study_platform
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root123456
      - DATABASE_URL=postgresql://root:root123456@49.233.182.71:5455/study_platform?schema=public
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

